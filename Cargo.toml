[package]
name = "dyad"
version = "0.1.0"
edition = "2024"

[dependencies]
actix-web = "4"
actix-files = "0.6"
hc_helper = { git = "https://github.com/breynard0/hc_helper.git" }
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres", "macros", "migrate", "chrono", "uuid"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
anyhow = "1.0.104"
log = "0.4.34"
pretty_env_logger = "0.5.0"
rand = "0.10.2"
